<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shpigotskiy Art Space — приложение</title>
  <meta name="robots" content="noindex">
  <!-- Старый вход в Mini App теперь ведёт на сам сайт: приложение = сайт. -->
  <meta http-equiv="refresh" content="0; url=index.html">

    try { var tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); } } catch (e) {}
    location.replace('index.html');
  </script>
</head>
<body>
  <p style="font-family:Inter,system-ui,sans-serif;padding:24px;color:#4A433D">
    Открываем приложение… Если не открылось автоматически —
    <a href="index.html" style="color:#E30613">нажмите сюда</a>.
  </p>
</body>
</html>
