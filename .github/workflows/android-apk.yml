# Сборка Android-приложения (app/) в APK.
# Готовый файл: вкладка Actions → запуск → Artifacts, а также релиз «android-latest»
# (Releases) — оттуда APK удобно скачать прямо на телефон.
name: Android APK

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Генерация Android-проекта
        run: npx expo prebuild --platform android --no-install

      - name: Сборка APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Имя файла
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="ArtSpace-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          cp "$NAME" ArtSpace.apk
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/${{ steps.apk.outputs.name }}

      - name: Релиз для скачивания на телефон
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Art Space — Android (последняя сборка)
          prerelease: true
          make_latest: false
          body: |
            Последняя сборка приложения из ветки `${{ github.ref_name }}` (коммит ${{ github.sha }}).
            Скачайте ArtSpace.apk на телефон и откройте. Android попросит разрешить установку из этого источника.
          files: app/ArtSpace.apk
          overwrite_files: true
